# =============================================================================
# PRODUCTION PROFILE CONFIGURATION
# =============================================================================

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json
    min-response-size: 1024
  tomcat:
    max-threads: 200
    min-spare-threads: 10
    accept-count: 100
    connection-timeout: 20000

spring:
  # Mail configuration
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Datasource configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1

  # JPA/Hibernate
  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 20
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: true
    hibernate:
      ddl-auto: validate

  # Devtools - Tắt trong production
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
    add-properties: false

  # Cache
  cache:
    type: none

# Flyway
flyway:
  enabled: true
  clean-disabled: true
  baseline-on-migrate: false
  validate-on-migrate: true
  out-of-order: false

# Actuator
management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      enabled: true
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          include: db
        liveness:
          include: ping
    info:
      enabled: true
    metrics:
      enabled: true
  metrics:
    export:
      simple:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name:ecommerce}
      environment: production

# Logging
logging:
  level:
    root: WARN
    org.springframework: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.boot: INFO
    org.hibernate: WARN
    com.asm.ecommerce: INFO
    com.zaxxer.hikari: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} : %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} : %msg%n"

# Custom properties
app:
  environment: production
  features:
    cache-enabled: false
    metrics-enabled: true
    debug-mode: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://milk-tea-ecommerce-fe.vercel.app}


# Gemini
gemini:
  api:
    timeout: 60s
    max-retries: 3

# VNPAY
vnpay:
  pay-url: ${VNPAY_PAY_URL:https://vnpayment.vn/paymentv2/vpcpay.html}
  api-url: ${VNPAY_API_URL:https://vnpayment.vn/merchant_webapi/api/transaction}
  return-url: ${VNPAY_RETURN_URL}
  ipn-url: ${VNPAY_IPN_URL}